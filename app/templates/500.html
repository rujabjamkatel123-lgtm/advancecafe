{% extends "base.html" %}
{% block title %}Internal Server Error{% endblock %}
{% block content %}
<div class="not-found-page">
    <div class="not-found-container">
        <div class="error-code">500</div>
        <h1>Internal Server Error</h1>
        <p>Something went wrong on the server. Please check your database connection and Vercel environment variables.</p>
        <a href="{{ url_for('auth.login') }}" class="not-found-button">Back to Login</a>
    </div>
</div>
{% endblock %}
